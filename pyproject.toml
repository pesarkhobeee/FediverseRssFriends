[project]
name = "rssfriends"
version = "0.2.31"
description = "Multi-user RSS radar with follow, favorites, and activity feeds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlmodel>=0.0.22",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "feedparser>=6.0.10",
    "apscheduler>=3.10",
    "defusedxml>=0.7",
    "resend>=2.0",
    "nh3>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 is a false positive for FastAPI's Depends() idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# conftest.py must set env vars before importing the app.
"tests/conftest.py" = ["E402", "SIM115"]
