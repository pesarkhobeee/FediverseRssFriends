{# Fuzzy user search results (HTMX partial). Expects `q`, `results`. #}
{% if not q %}
  {# Empty query — clear the results area. #}
{% elif results %}
  <ul class="fav-list">
    {% for u in results %}
      <li class="fav-item">
        <div class="fav-head">
          <a class="title" href="/u/{{ u.handle }}">@{{ u.handle }}</a>
          <span class="spacer"></span>
          <a class="btn-ghost" href="/u/{{ u.handle }}">View radar →</a>
        </div>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p class="muted">No public radars match “{{ q }}”.</p>
{% endif %}
