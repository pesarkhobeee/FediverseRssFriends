{# State-aware "Add to my radar" CTA. Expects `feed` and `state` in
   {anonymous, subscribed, available}. Rendered as an outerHTML swap
   target so HTMX can flip it after an add. #}
<span id="feed-cta-{{ feed.id }}" class="feed-cta">
{% if state == "subscribed" %}
  <span class="cta-badge">✓ Following</span>
{% elif state == "available" %}
  <button class="btn"
          hx-get="/f/{{ feed.id }}/add-picker"
          hx-target="#feed-cta-{{ feed.id }}"
          hx-swap="innerHTML">
    ➕ Add to my radar
  </button>
{% else %}
  <a class="btn" href="/#login" title="Sign in to subscribe">
    Sign in
  </a>
{% endif %}
</span>
