{# Bookmark toggle. `item_id` and `is_bookmarked` are required.
   Star glyph kept from the pre-rename UI — cleaner outline / filled
   affordance than the emoji tags, and users already learned it. #}
{% if is_bookmarked %}
<button class="bookmark bookmark-on"
        hx-delete="/items/{{ item_id }}/bookmark"
        hx-swap="outerHTML"
        title="Remove bookmark"
        aria-label="Remove bookmark">★</button>
{% else %}
<button class="bookmark"
        hx-post="/items/{{ item_id }}/bookmark"
        hx-swap="outerHTML"
        title="Bookmark this item"
        aria-label="Bookmark this item">☆</button>
{% endif %}
