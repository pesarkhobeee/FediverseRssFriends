{% extends "base.html" %}
{% block content %}
<section class="hero stack">
  <h1>Your RSS radar.</h1>
  <p>Follow the web. Share what you read. Discover through people, not algorithms.</p>
</section>

<section id="login" class="login">
  <h2 style="margin-top:0">Sign in</h2>
  <p class="muted">Enter your email — we'll send you a magic link. No password, no signup form.</p>
  <form method="post" action="/login" class="login-form">
    <input type="email" name="email" required autocomplete="email"
           placeholder="you@example.com" class="input" />
    <button type="submit" class="btn">Send magic link</button>
  </form>
</section>
{% endblock %}
