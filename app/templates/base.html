<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}rssFriends{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='favicon.svg') }}?v={{ app_version }}">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v={{ app_version }}">
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
</head>
<body>
  <header>
    <a href="/" class="brand">rssFriends</a>
    <nav>
      {% if user %}
        <a href="/u/{{ user.handle }}" class="nav-user" title="Your public radar">@{{ user.handle }}</a>
      {% endif %}
      <a href="/discover">Discover</a>
      {% if user %}
        <a href="/feed">Timeline</a>
        <a href="/u/{{ user.handle }}/favorites">Favorites</a>
        <a href="/u/{{ user.handle }}/activity">My activity</a>
        <a href="/follow-requests">Requests</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/logout">Logout</a>
      {% else %}
        <a href="/#login">Login</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>

  <div id="net-toast" class="net-toast" role="alert" aria-live="polite" hidden>
    <span class="net-toast-icon" aria-hidden="true">🚧</span>
    <span class="net-toast-msg">Can't reach the server. Check your connection.</span>
    <button class="net-toast-close" type="button" onclick="this.parentElement.hidden = true">✕</button>
  </div>

  <script>
    // Favicon fallback chain: if <img class="favicon"> 404s, try the two
    // other common paths on the same host before giving up. Server-side
    // resolve handles most cases; this catches sites we didn't scrape.
    (function () {
      function nextCandidate(img) {
        try {
          var u = new URL(img.src);
          var host = u.protocol + "//" + u.host;
          var tried = (img.dataset.tried || "").split("|").filter(Boolean);
          var candidates = ["/favicon.png", "/apple-touch-icon.png"];
          for (var i = 0; i < candidates.length; i++) {
            var next = host + candidates[i];
            if (tried.indexOf(next) === -1 && img.src !== next) {
              tried.push(next);
              img.dataset.tried = tried.join("|");
              img.src = next;
              return;
            }
          }
        } catch (_) { /* bad URL — just hide */ }
        img.style.visibility = "hidden";
      }
      document.addEventListener("error", function (evt) {
        var t = evt.target;
        if (t && t.tagName === "IMG" && t.classList.contains("favicon")) {
          nextCandidate(t);
        }
      }, true);  // capture — img error events don't bubble
    })();
  </script>
  <script>
    (function () {
      var toast = document.getElementById("net-toast");
      var msg = toast.querySelector(".net-toast-msg");

      function show(text) {
        msg.textContent = text;
        toast.hidden = false;
      }

      document.body.addEventListener("htmx:sendError", function () {
        show("Can't reach the server. Check your connection.");
      });
      document.body.addEventListener("htmx:responseError", function (evt) {
        var s = evt.detail && evt.detail.xhr ? evt.detail.xhr.status : 0;
        if (s === 401) { window.location.href = "/"; return; }
        if (s === 403) { show("You don't have access to this."); return; }
        if (s === 404) { show("Not found."); return; }
        if (s === 429) { show("Slow down — too many requests."); return; }
        if (s >= 500) { show("Server error (" + s + "). Try again in a moment."); return; }
        show("Something went wrong (" + s + ").");
      });
      document.body.addEventListener("htmx:afterRequest", function (evt) {
        if (evt.detail && evt.detail.successful) toast.hidden = true;
      });
      window.addEventListener("offline", function () {
        show("You're offline. Changes won't save until you reconnect.");
      });
      window.addEventListener("online", function () { toast.hidden = true; });
    })();
  </script>
</body>
</html>
