<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}rssRadar{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
</head>
<body>
  <header>
    <a href="/" class="brand">rssRadar</a>
    <nav>
      <a href="/discover">Discover</a>
      {% if user %}
        <a href="/feed">Activities</a>
        <a href="/u/{{ user.handle }}" class="nav-user" title="Your public radar">@{{ user.handle }}</a>
        <a href="/u/{{ user.handle }}/favorites">Favorites</a>
        <a href="/u/{{ user.handle }}/activity">My activity</a>
        <a href="/follow-requests">Requests</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/logout">Logout</a>
      {% else %}
        <a href="/#login">Login</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
