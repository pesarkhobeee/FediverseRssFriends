services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./data:/data
      - ./backups:/backups
    env_file: .env
    environment:
      RSSFRIENDS_DATA_DIR: /data
      RSSFRIENDS_BACKUP_DIR: /backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
